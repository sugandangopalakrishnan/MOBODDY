  }

<style>
  #wt-root {
    --bg: #14161A;
    --surface: #1D2025;
    --surface-2: #262A31;
    --line: #33383F;
    --text: #ECEDEE;
    --muted: #8B9299;
    --chalk: #D3F26A;
    --chalk-dim: #8A9A4E;
    --steel: #6E8AA8;
    --danger: #E2604F;
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    border-radius: 16px;
    padding: 0;
    max-width: 720px;
    margin: 0 auto;
    overflow: hidden;
  }
  #wt-root * { box-sizing: border-box; }
  #wt-root .num, #wt-root input, #wt-root .weight-val {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }
  #wt-root .head {
    padding: 24px 24px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #191C21 0%, #14161A 100%);
  }
  #wt-root .eyebrow {
    color: var(--chalk);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 6px;
  }
  #wt-root h1 {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  #wt-root a { color: var(--steel); }
  #wt-root p { line-height: 1.6; font-size: 13px; }
  #wt-root .suggest { max-width: 130px; }
  #wt-root .sub { color: var(--muted); font-size: 13px; }
  #wt-root .tabs {
    display: flex;
    padding: 0 24px;
    gap: 4px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  #wt-root .tab {
    padding: 14px 14px 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    position: relative;
  }
  #wt-root .tab.active { color: var(--text); border-bottom-color: var(--chalk); }
  #wt-root .tab .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--chalk); margin-left: 6px; transform: translateY(-1px);

  #wt-root .body { padding: 20px 24px 28px; }

  #wt-root .day-banner h2 {

  #wt-root .muscle-tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

  #wt-root .watch-form {

// --- Standalone localStorage-backed storage shim (mirrors Claude artifact storage API) ---
window.storage = {
  get: async (key, shared) => {
    const raw = localStorage.getItem(key);
    if (raw === null) throw new Error('Key not found: ' + key);
    return { key, value: raw, shared: !!shared };
  },
  set: async (key, value, shared) => {
    localStorage.setItem(key, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: !!shared };
  }
};

  const DAY_ORDER = Object.keys(PROGRAM);

  };

  let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  let history = { sessions: [] };
  let profile = { weightKg: 64, heightIn: "5'10\"", goal: 'Build muscle', experience: 'Some experience (6mo-2yr)', equipmentNotes: '' };
  let activeDay = DAY_ORDER[0];
  let draft = {}; // exId -> [{weight, reps}, ...]
  let progressIds = {};
  let progressUpdatedAt = null;
  let savingSession = false;

  function saveProgress(exId) {
    if (PROGRAM[activeDay]?.some(ex => draft[ex.id]?.some(row => row && Object.values(row).some(value => value !== null))) && !progressIds[activeDay]) progressIds[activeDay] = 'progress-' + Date.now() + '-' + Math.random().toString(36).slice(2);

      localStorage.setItem('workout-progress', JSON.stringify({version:1, draft, progressIds, day:activeDay, updatedAt}));
      progressUpdatedAt = updatedAt;
      showProgressStatus(exId, 'Progress saved on this phone · ' + new Date(updatedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
      return true;
    } catch (error) {
      showProgressStatus(exId, 'Could not save progress. Keep this page open and try again.');
      return false;
    }
  }

  function showProgressStatus(exId, message) {
    ROOT.querySelectorAll('[data-progress-status]').forEach(status => {
      if (!exId || status.dataset.progressStatus === exId) status.textContent = message;
    });
  }

  function clearDayProgress(day) {
    for (const ex of PROGRAM[day] || []) delete draft[ex.id];
    delete progressIds[day];
  }

  async function loadAll() {
    try {
      const h = await window.storage.get('history', false);
      if (h && h.value) history = JSON.parse(h.value);

    try {

      if (p && p.value) profile = JSON.parse(p.value);
    } catch (e) { /* defaults stand */ }

    activeDay = suggestNextDay();
    try {
      const saved = JSON.parse(localStorage.getItem('workout-progress'));
      if (saved && saved.version === 1 && saved.draft && typeof saved.draft === 'object') {
        for (const exercises of Object.values(PROGRAM)) for (const ex of exercises) {

          if (Array.isArray(rows)) draft[ex.id] = rows.slice(0, ex.sets).map(row => {
            if (!row || typeof row !== 'object') return null;
            const clean = {};
            for (const field of ['weight', 'reps']) if (Object.prototype.hasOwnProperty.call(row, field)) clean[field] = Number.isFinite(row[field]) && row[field] >= 0 ? row[field] : null;
            return clean;
          });
        }
        progressIds = saved.progressIds && typeof saved.progressIds === 'object' ? saved.progressIds : {};
        for (const day of DAY_ORDER) if (progressIds[day] && history.sessions.some(session => session.progressId === progressIds[day])) clearDayProgress(day);
        progressUpdatedAt = saved.updatedAt;
        if (PROGRAM[saved.day] && PROGRAM[saved.day].some(ex => draft[ex.id]?.some(row => row && Object.values(row).some(value => value !== null)))) activeDay = saved.day;
      }
    } catch (error) { /* completed history still loads if the draft is unavailable */ }
    render();
  }

  function suggestNextDay() {
    if (!history.sessions.length) return DAY_ORDER[0];
    const last = history.sessions[history.sessions.length - 1];
    const idx = DAY_ORDER.indexOf(last.day);
    return DAY_ORDER[(idx + 1) % DAY_ORDER.length];
  }

  function lastPerformance(exId) {
    for (let i = history.sessions.length - 1; i >= 0; i--) {
      const s = history.sessions[i];
      const ex = s.exercises.find(e => e.id === exId);
      if (ex) return { session: s, ex };
    }
    return null;
  }

  function recentHistory(exId, n) {
    const out = [];
    for (let i = history.sessions.length - 1; i >= 0 && out.length < n; i--) {
      const s = history.sessions[i];
      const ex = s.exercises.find(e => e.id === exId);
      if (ex) out.push({ date: s.date, ex });
    }
    return out.reverse();
  }

  function suggestion(exDef) {
    const last = lastPerformance(exDef.id);
    if (!last) return { weight: null };
    const counts = new Map();
    for (const set of last.ex.sets) {
      if (Number.isFinite(set.weight) && set.weight >= 0) counts.set(set.weight, (counts.get(set.weight) || 0) + 1);
    }
    let weight = null, highestCount = 0;
    // Map preserves set order: the first logged weight wins a frequency tie.
    for (const [value, count] of counts) if (count > highestCount) { weight = value; highestCount = count; }
    return { weight };
  }

  function fmtDate(d) {
    const dt = new Date(d);
    return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function render() {
    ROOT.innerHTML = `
      <div class="head">
        <div class="eyebrow">5-Session Cycle · 3 Exercises · Muscle Gain</div>
        <h1>Today's Session</h1>
        <div class="sub">${esc(profile.weightKg ?? 64)}kg · ${esc(profile.heightIn ?? "5'10\"")} · ${esc(profile.experience ?? "Some experience")}</div>
        <div class="sub">10-min run · 3 sets × 10 reps · up to 60 min total</div>
      </div>
      <div class="tabs">
        ${DAY_ORDER.map(d => `
          <div class="tab ${d === activeDay ? 'active' : ''}" data-day="${d}">
            ${d}${d === suggestNextDay() && d !== activeDay ? '<span class="dot"></span>' : ''}
          </div>
        `).join('')}
        <div class="tab ${activeDay === 'Warm-up' ? 'active' : ''}" data-day="Warm-up">Warm-up</div>
        <div class="tab ${activeDay === 'Guide' ? 'active' : ''}" data-day="Guide">Guide & backup</div>
      </div>
      <div class="body">
        ${activeDay === 'Warm-up' ? renderWarmup() : activeDay === 'Guide' ? renderGuide() : renderDay()}
      </div>
    `;

    ROOT.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      activeDay = t.dataset.day;
      render();
    }));
    if (PROGRAM[activeDay]) {
      ROOT.querySelectorAll('input[data-ex]').forEach(inp => inp.addEventListener('input', onInputChange));
      document.getElementById('wt-save').addEventListener('click', saveSession);
      document.getElementById('wt-reset').addEventListener('click', () => {
        clearDayProgress(activeDay);
        const saved = saveProgress(); render();
        if (!saved) showProgressStatus(null, 'Could not clear saved progress. Keep this page open and try again.');
      });
      ROOT.querySelectorAll('[data-save-progress]').forEach(button => button.addEventListener('click', () => saveProgress(button.dataset.saveProgress)));
      const equipEl = document.getElementById('wt-equip');
      equipEl.addEventListener('blur', saveProfile);
    } else if (activeDay === 'Guide') {
      document.getElementById('wt-export').addEventListener('click', exportBackup);
      document.getElementById('wt-import').addEventListener('change', importBackup);
      ROOT.querySelectorAll('[data-month-step]').forEach(button => button.addEventListener('click', () => {
        calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + Number(button.dataset.monthStep), 1);
        render();
      }));
      document.getElementById('wt-calendar-today').addEventListener('click', () => {
        calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render();
      });
    }
  }

  function renderWarmup() {
    return `<div class="warmup-block"><h3>1. Your 10-minute run</h3><p>Run at an easy, conversational pace so you still feel ready to lift.</p></div>
      <div class="warmup-block"><h3>2. Prepare for the first lift · 3–5 min</h3><p>Do 1–2 lighter practice sets of today’s first exercise: approximately 50% of working weight for 8 reps, then 75% for 4–5 reps if useful. Prepare again with a light set when switching to a new movement. These are not logged working sets.</p></div>
      <div class="warmup-block"><h3>3. Three exercises · around 25–40 min</h3><p>Do 3 sets of 10 reps for each exercise. Rest 2–3 minutes on compound lifts, 90–120 seconds on isolation exercises, or longer when needed. For single-side exercises, complete 10 on each side before the main rest.</p></div>
      <div class="warmup-total">Usually around 40–60 minutes including setup. Finish when done; no need to fill the hour.</div>`;
  }

  function localDateKey(date) {
    return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
  }

  function renderCalendar() {
    const year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
    const days = new Date(year, month + 1, 0).getDate();
    const offset = (new Date(year, month, 1).getDay() + 6) % 7;
    const sessionsByDate = new Map();
    for (const session of history.sessions) {
      const date = new Date(session.date);
      if (!Number.isFinite(date.getTime())) continue;
      const key = localDateKey(date);
      if (!sessionsByDate.has(key)) sessionsByDate.set(key, []);
      sessionsByDate.get(key).push(session.day);
    }
    const today = localDateKey(new Date());
    let workoutDays = 0;
    const cells = Array.from({length: offset}, () => '<div aria-hidden="true"></div>');
    for (let day = 1; day <= days; day++) {
      const date = new Date(year, month, day), key = localDateKey(date);
      const sessions = sessionsByDate.get(key) || [];
      if (sessions.length) workoutDays++;
      const label = date.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'}) + (sessions.length ? ': ' + sessions.join(', ') : ': no workout logged');
      cells.push(`<div class="calendar-day ${sessions.length ? 'workout' : ''} ${key === today ? 'today' : ''}" role="gridcell" aria-label="${esc(label)}" ${key === today ? 'aria-current="date"' : ''} title="${esc(label)}">${day}</div>`);
    }
    return `<div class="warmup-block"><h3>Workout calendar</h3>
      <div class="calendar-head"><button class="ghost" data-month-step="-1" aria-label="Previous month">←</button><strong aria-live="polite">${esc(calendarMonth.toLocaleDateString(undefined, {month:'long', year:'numeric'}))}</strong><button class="ghost" data-month-step="1" aria-label="Next month">→</button></div>
      <div class="calendar-grid" role="grid" aria-label="Workout days">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day => `<div class="calendar-weekday" role="columnheader">${day}</div>`).join('')}${cells.join('')}</div>
      <div class="calendar-legend">Green = workout logged · outline = today<br>${workoutDays} workout ${workoutDays === 1 ? 'day' : 'days'} this month. Dates use your device’s local time.</div>
      <button class="ghost" id="wt-calendar-today" style="margin-top:12px">Current month</button></div>`;
  }

  function renderGuide() {
    return `${renderCalendar()}<div class="warmup-block"><h3>Your repeating cycle</h3><p>Upper A → Lower A → Upper B → Lower B → Accessories → repeat. Choose the dates yourself and insert rest days as needed. These are five sessions, not five consecutive days. The dot marks the next suggested session.</p><p>Each session has exactly 3 exercises × 3 sets × 10 reps. Choose weights that leave about 1–3 clean reps in reserve. Suggested shows the weight used in the most sets during your last logged session of that exercise. Reps do not affect it. If weights tie, the first logged weight wins. It stays blank until you log the exercise. Type your chosen weights into the empty boxes; saved unfinished entries are restored.</p><p>Log kg per dumbbell, total ball weight, or the machine’s selected stack weight. Convert pounds to kg if needed (lb ÷ 2.205). On unilateral moves, log 10 after completing 10 each side. Machine weights are not comparable across different machines.</p></div>
      <div class="warmup-block"><h3>Comfort and recovery</h3><p>No seated overhead presses. Take standing breaks between seated machine sets. Brief sitting may still irritate symptoms: stop an aggravating movement and use your physio’s guidance to adjust it. Use the physio-taught versions of the hinge and lunges; videos supplement that instruction. If symptoms become worse during or after training, ease back and check with your physio before progressing.</p></div>
      <div class="warmup-block"><h3>Training sources</h3><p>This is a custom routine adapted to a three-exercise limit, not an unchanged proven program. The foundation is consistent training, progression and balanced movement patterns from <a href="https://thefitness.wiki/muscle-building-101/" target="_blank" rel="noopener">Muscle Building 101</a>, <a href="https://thefitness.wiki/routines/strength-training-muscle-building/" target="_blank" rel="noopener">r/Fitness recommended routines</a> and the <a href="https://www.reddit.com/r/Fitness/comments/ezqa9m/" target="_blank" rel="noopener">r/Fitness instructional video thread</a>. Each card lists target muscles, a YouTube demonstration and, where relevant, official HOIST setup instructions. Most videos demonstrate the movement on a different machine; match your machine using its setup link.</p></div>
      <div class="warmup-block"><h3>Your phone data</h3><p>History and equipment notes stay in this browser’s local storage, with the original history and profile keys preserved. No account or cloud sync. Keep the same website address and browser to retain access. Clearing website data or moving devices can lose it. Download backups regularly.</p><button class="primary" id="wt-export">Download backup</button><p><label>Restore a backup <input type="file" id="wt-import" accept="application/json,.json"></label></p><div class="toast" id="wt-toast"></div></div>
      <div class="warmup-block"><h3>All saved sessions</h3>${history.sessions.length ? history.sessions.slice().reverse().map(session => `<details><summary>${esc(fmtDate(session.date))} · ${esc(session.day)}</summary>${session.exercises.map(ex => `<p>${esc(ex.name)}: ${ex.sets.map(set => esc(set.weight) + ' kg × ' + esc(set.reps)).join(', ')}</p>`).join('')}</details>`).join('') : '<p>No sessions logged yet.</p>'}</div>`;
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify({version: 1, history, profile}, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url;
    link.download = 'moboddy-backup-' + new Date().toISOString().slice(0,10) + '.json';
    link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function importBackup(event) {
    const file = event.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data.history || !Array.isArray(data.history.sessions) || !data.profile || typeof data.profile !== 'object' || Array.isArray(data.profile)) throw new Error('Invalid backup');
      for (const session of data.history.sessions) {
        if (typeof session.day !== 'string' || !Number.isFinite(Date.parse(session.date)) || !Array.isArray(session.exercises)) throw new Error('Invalid session');
        for (const ex of session.exercises) {
          if (typeof ex.id !== 'string' || typeof ex.name !== 'string' || !Array.isArray(ex.sets) || !ex.sets.length || ex.sets.some(set => !Number.isFinite(set.weight) || set.weight < 0 || !Number.isInteger(set.reps) || set.reps <= 0)) throw new Error('Invalid exercise');
        }
      }
      if (!confirm('Replace this browser’s history and profile with the backup? Download a current backup first if you want to keep both.')) return;
      const oldHistory = localStorage.getItem('history'), oldProfile = localStorage.getItem('profile');
      try {
        localStorage.setItem('history', JSON.stringify(data.history)); localStorage.setItem('profile', JSON.stringify(data.profile));
      } catch (error) {
        if (oldHistory === null) localStorage.removeItem('history'); else localStorage.setItem('history', oldHistory);
        if (oldProfile === null) localStorage.removeItem('profile'); else localStorage.setItem('profile', oldProfile);
        throw error;
      }
      history = data.history; profile = data.profile; render();
      document.getElementById('wt-toast').textContent = 'Backup restored.';
    } catch (error) { document.getElementById('wt-toast').textContent = 'Unable to restore: invalid backup or storage unavailable. Existing data kept.'; }
    document.getElementById('wt-toast').classList.add('show'); event.target.value = '';
  }

  function renderDay() {
    const exercises = PROGRAM[activeDay];
    const lastSession = history.sessions.length ? history.sessions[history.sessions.length - 1] : null;
    return `
        <div class="setup-note">
          <strong style="color:var(--text)">Today’s plan</strong> — 10-minute easy run, preparation sets, then 3 exercises × 3 sets × 10 reps. Rest as listed on each card. Stand between seated sets; skip any movement that aggravates symptoms. Keep 1–3 clean reps in reserve.
          <br><br><strong style="color:var(--text)">Equipment notes</strong> — saved automatically when you leave this field.
          <textarea id="wt-equip" placeholder="e.g. cable tower with lat pulldown + row attachment, leg press, no barbell rack...">${esc(profile.equipmentNotes || '')}</textarea>
        </div>
        <div class="ex-target" style="margin-bottom:14px;line-height:1.6">Your entries save as you type. Save progress keeps this workout unfinished; Log this session adds it to history and the calendar.</div>
        <div class="day-banner">
          <h2>${activeDay}</h2>
          <div class="last-done">${lastSession ? `Last session: ${lastSession.day} · ${fmtDate(lastSession.date)}` : 'No sessions logged yet'}</div>
        </div>
        <div class="muscle-tags">${(DAY_MUSCLES[activeDay] || []).map(m => `<span class="muscle-tag">${m}</span>`).join('')}</div>
        ${exercises.map(ex => renderCard(ex)).join('')}
        <div class="save-bar">
          <button class="ghost" id="wt-reset">Clear inputs</button>
          <button class="primary" id="wt-save">Log this session</button>
        </div>
        <div class="toast" id="wt-toast"></div>
    `;
  }

  function renderCard(ex) {
    const sug = suggestion(ex);
    const hist = recentHistory(ex.id, 3);
    const isTime = ex.name.toLowerCase().includes('plank');
    const unit = isTime ? 'sec' : 'reps';

    let rowsHtml = '';
    for (let i = 0; i < ex.sets; i++) {
      const savedRow = (draft[ex.id] && draft[ex.id][i]) || {};
      const wVal = savedRow.weight ?? '';
      const rVal = savedRow.reps ?? '';
      rowsHtml += `
        <div class="set-row">
          <div class="set-idx">${i + 1}</div>
          <div class="input-wrap">
            <span>kg</span>
            <input type="text" inputmode="decimal" placeholder="wt" value="${wVal}" data-ex="${ex.id}" data-set="${i}" data-field="weight">
          </div>
          <div class="input-wrap">
            <span>${unit}</span>
            <input type="text" inputmode="numeric" placeholder="${unit}" value="${rVal}" data-ex="${ex.id}" data-set="${i}" data-field="reps">
          </div>
        </div>`;
    }

    return `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-target">${ex.sets} sets × ${ex.repMin === ex.repMax ? ex.repMin : ex.repMin + '–' + ex.repMax} ${unit}${ex.perSide ? " per side" : ""}</div>
            <div class="ex-target">${ex.equipment}</div>
            <div class="ex-target">Targets: ${ex.muscles}</div>
            ${ex.video ? `<a class="watch-form" href="https://www.youtube.com/watch?v=${ex.video}" target="_blank" rel="noopener noreferrer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
              Watch form on YouTube
            </a>` : ''}
            ${ex.setup ? `<br><a class="watch-form" href="${ex.setup}" target="_blank" rel="noopener noreferrer">HOIST setup instructions</a>` : ''}
          </div>
          <div class="suggest">
            <div class="label">Suggested</div>
            <div class="weight-val">${sug.weight !== null ? sug.weight + ' kg' : '—'}</div>
            ${sug.weight !== null ? '<div class="ex-target">Most-used weight last time</div>' : ''}
          </div>
        </div>
        <div class="ex-target" style="line-height:1.6">${ex.cue}<br>Rest: ${ex.rest}</div>
        <div class="sets-grid">${rowsHtml}</div>
        <button class="ghost" data-save-progress="${ex.id}" style="margin-top:12px">Save progress</button>
        <div class="ex-target" data-progress-status="${ex.id}" role="status" style="margin-top:6px;line-height:1.5">${draft[ex.id]?.some(row => row && Object.values(row).some(value => value !== null)) ? 'Unfinished entries · finish with Log this session' : 'Entries save automatically on this phone'}</div>
        ${hist.length ? `<div class="hist-strip">${hist.map(h => `<span class="hist-chip">${fmtDate(h.date)}: ${h.ex.sets.map(s => s.weight + '×' + s.reps).join(', ')}</span>`).join('')}</div>` : ''}
      </div>
    `;
  }

  function onInputChange(e) {
    const exId = e.target.dataset.ex;
    const setIdx = parseInt(e.target.dataset.set, 10);
    const field = e.target.dataset.field;
    const raw = e.target.value.trim();
    const val = raw === '' ? NaN : Number(raw);
    if (!draft[exId]) draft[exId] = [];
    if (!draft[exId][setIdx]) draft[exId][setIdx] = {};
    draft[exId][setIdx][field] = Number.isFinite(val) ? val : null;
    saveProgress(exId);
  }

  async function saveProfile() {
    profile.equipmentNotes = document.getElementById('wt-equip').value;
    try {
      await window.storage.set('profile', JSON.stringify(profile), false);
    } catch (e) { console.error('profile save failed', e); }
  }

  async function saveSession() {
    if (savingSession) return;
    const completedDay = activeDay;
    const exercises = PROGRAM[activeDay];
    const loggedExercises = [];

    exercises.forEach(ex => {
      const rows = draft[ex.id];
      if (!rows) return;
      const validSets = rows.filter(r => r && Number.isFinite(r.weight) && r.weight >= 0 && Number.isInteger(r.reps) && r.reps > 0);
      if (validSets.length) {
        loggedExercises.push({ id: ex.id, name: ex.name, sets: validSets });
      }
    });

    const toastEl = document.getElementById('wt-toast');
    if (!loggedExercises.length) {
      toastEl.textContent = 'Log at least one set before saving.';
      toastEl.classList.add('show');
      return;
    }

    savingSession = true;
    document.getElementById('wt-save').disabled = true;
    const session = { date: new Date().toISOString(), day: completedDay, exercises: loggedExercises, progressId: progressIds[completedDay] || null };
    const updatedHistory = { ...history, sessions: [...history.sessions, session] };

    try {
      const result = await window.storage.set('history', JSON.stringify(updatedHistory), false);
      if (!result) throw new Error('no result');
      history = updatedHistory;
      toastEl.textContent = `Saved ${activeDay} — ${loggedExercises.length} exercise(s) logged. Nice work.`;
      toastEl.classList.add('show');
      clearDayProgress(completedDay);
      saveProgress();
      setTimeout(() => { activeDay = suggestNextDay(); render(); }, 900);
    } catch (e) {
      toastEl.textContent = 'Something went wrong saving — try again.';
      toastEl.classList.add('show');
      console.error(e);
    } finally {
      savingSession = false;
      const button = document.getElementById('wt-save'); if (button) button.disabled = false;
    }
  }

  loadAll();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed', e));
  });
}
</script>

</body>
</html>
